name: Despliegue Continuo Homelab

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar cambios del repositorio
        uses: actions/checkout@v4

      - name: Desplegar portafolio con Docker
        run: |
          set -e
          cp -a "$GITHUB_WORKSPACE"/. /opt/portfolio-henry/
          cd /opt/portfolio-henry
          docker compose up -d --build
          docker compose ps
