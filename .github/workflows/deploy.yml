name: Despliegue Continuo Homelab

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Descargar cambios del repositorio
        uses: actions/checkout@v4

      - name: Desplegar portafolio con Docker
        run: |
          set -e
          docker rm -f henry-portfolio portfolio-henry 2>/dev/null || true
          docker compose up -d --build --remove-orphans
          docker image prune -f
          sleep 2
          docker compose ps
          curl -fsS http://localhost | grep -i "<title>"
